<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book CRUD</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand">Book Form</span>
    <span class="text-white">
        <span id="loggedUser"></span>
        <button id="logoutBtn" class="btn btn-sm btn-light ml-2">Logout</button>
    </span>
</nav>

<div class="container mt-4">
    <div id="message"></div>

    <div id="adminPanel" class="card mb-4">
        <div class="card-header">Add / Edit Book - ADMIN</div>
        <div class="card-body">
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Title</label>
                        <input id="title" class="form-control" required maxlength="45">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Price</label>
                        <input id="price" type="number" step="0.01" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Author</label>
                        <input id="authorName" class="form-control" required maxlength="45">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Publication</label>
                        <input id="publicationName" class="form-control" required maxlength="45">
                    </div>
                </div>
                <div class="form-group">
                    <label>Publication Date</label>
                    <input id="publicationDate" type="date" class="form-control" required>
                </div>
                <button class="btn btn-primary" type="submit">Save</button>
                <button class="btn btn-secondary" type="button" id="clearBtn">Clear</button>
            </form>
        </div>
    </div>

    <h4>Books</h4>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Author</th><th>Price</th>
            <th>Publication</th><th>Date</th><th id="actionHeader">Action</th>
        </tr>
        </thead>
        <tbody id="bookTable"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/books.js"></script>
</body>
</html>
