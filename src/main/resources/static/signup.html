<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book CRUD - Sign Up</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header"><h4>Create New User</h4></div>
                <div class="card-body">
                    <div id="message"></div>

                    <div class="form-group">
                        <label>Username</label>
                        <input id="username" class="form-control" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input id="password" type="password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input id="confirmPassword" type="password" class="form-control">
                    </div>

                    <button id="signupBtn" class="btn btn-success btn-block">
                        Create Account
                    </button>

                    <div class="text-center mt-3">
                        Already registered?
                        <a href="/login.html">Login here</a>
                    </div>

                    <small class="text-muted d-block mt-3">
                        New registrations are created with USER role.
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
